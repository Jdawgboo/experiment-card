[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-card"
version = "0.1.0"
description = "Generate review-ready ML experiment cards from structured results"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["machine-learning", "reproducibility", "model-card", "experiment-tracking"]

[project.scripts]
experiment-card = "experiment_card.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
